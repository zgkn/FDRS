name: FDRS fit

# Joins the hotspot counts and FWI indices of "FDRS data pipeline" runs and fits the logistic regressions.
# Needs full (not smoke) data runs whose artifacts (kept 30 days) are still there. Years may come from several runs: give
# every run id, comma separated; a year found in more than one run is read once per run (the files are identical).
# Run by hand: Actions > FDRS fit > Run workflow.

on:
  workflow_dispatch:
    inputs:
      hotspots_run_ids:
        description: "Run ids (comma separated) of the data runs that made the hotspot artifacts"
        required: true
      fwi_run_ids:
        description: "Run ids (comma separated) that made the FWI artifacts (blank = the same runs as the hotspots)"
        required: false
        default: ""
      train_years:
        description: "Years the models are fitted and left-one-out validated on, comma separated"
        required: false
        default: "2019,2020,2021,2022,2023"
      holdout_years:
        description: "Years only scored with the fit on the training years (type none for no hold-out: a blank value is replaced by the default 2015)"
        required: false
        default: "2015"

permissions:
  contents: read
  actions: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the artifacts of the data runs
        env:
          GH_TOKEN: ${{ github.token }}
          HOTSPOT_RUNS: ${{ github.event.inputs.hotspots_run_ids }}
          FWI_RUNS: ${{ github.event.inputs.fwi_run_ids }}
        run: |
          fwi_runs="${FWI_RUNS:-$HOTSPOT_RUNS}"
          for id in $(echo "$HOTSPOT_RUNS" | tr ',' ' '); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'hotspots-*' --dir "data/hotspots/run_$id"
          done
          for id in $(echo "$fwi_runs" | tr ',' ' '); do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'fwi-*' --dir "data/fwi/run_$id"
          done
          find data -type f | sort | sed 's/^/  /'
      - name: Join into one training table
        run: python scripts/join_training.py --hotspots-dir data/hotspots --fwi-dir data/fwi --out out/training.parquet
      - name: Fit the logistic regressions
        env:
          TRAIN: ${{ github.event.inputs.train_years }}
          HOLDOUT: ${{ github.event.inputs.holdout_years }}
        run: |
          [ "$HOLDOUT" = "none" ] && HOLDOUT=""
          python scripts/fit_logistic.py --table out/training.parquet --train-years "$TRAIN" --holdout-years "$HOLDOUT" --outdir out/fit
      - name: Show the report
        run: |
          cat out/fit/report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/fit/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: fit-report
          path: |
            out/fit/
            out/training.parquet
          retention-days: 30
