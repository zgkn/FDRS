name: FDRS data pipeline

# Hotspot cell counts (FIRMS VIIRS) and FWI-System indices (ARCO-ERA5) for the southern ASEAN box, one job per year.
# Run by hand: Actions > FDRS data pipeline > Run workflow. "smoke" runs one 10-day window (2019-09-01..10) to prove the
# FIRMS key and the ERA5 read work before a full run.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to run, comma separated (the pilot 2019-2023 plus 2015, the held-out extreme year)"
        required: false
        default: "2015,2019,2020,2021,2022,2023"
      smoke:
        description: "Smoke test: only the 10 days 2019-09-01..10 (tick off for the full years)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (FWI codes against the report's test data, FIRMS filtering and de-duplication)
        run: python -m pytest -q tests

  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - id: years
        env:
          YEARS: ${{ github.event.inputs.years }}
          SMOKE: ${{ github.event.inputs.smoke }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          smoke = os.environ.get("SMOKE", "true") == "true"
          years = ["2019"] if smoke else [y.strip() for y in os.environ.get("YEARS", "").split(",") if y.strip()]
          assert years and all(y.isdigit() and 2012 <= int(y) <= 2100 for y in years), years
          print("years=" + json.dumps(years))
          EOF

  hotspots:
    needs: [test, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download FIRMS hotspots and count them per cell
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          SMOKE: ${{ github.event.inputs.smoke }}
        run: |
          if [ "$SMOKE" = "true" ]; then
            python scripts/download_firms.py --start 2019-09-01 --end 2019-09-10 --outdir out
          else
            python scripts/download_firms.py --year ${{ matrix.year }} --outdir out
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hotspots-${{ matrix.year }}
          path: out/
          retention-days: 30

  fwi:
    needs: [test, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: FWI-System indices from ARCO-ERA5
        env:
          SMOKE: ${{ github.event.inputs.smoke }}
        run: |
          if [ "$SMOKE" = "true" ]; then
            python scripts/era5_fwi.py --start 2019-09-01 --end 2019-09-10 --spinup-days 60 --out out/fwi_${{ matrix.year }}.nc
          else
            python scripts/era5_fwi.py --year ${{ matrix.year }} --out out/fwi_${{ matrix.year }}.nc
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fwi-${{ matrix.year }}
          path: out/
          retention-days: 30
